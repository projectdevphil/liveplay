<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Token Authentication - Liveplay for TV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <style>
        :root {
            --card-background: #1a1a1a;
            --text-color: #fff;
            --text-secondary: #ccc;
            --glass-border: 1px solid rgba(255, 255, 255, 0.05);
            --input-bg: rgba(255, 255, 255, 0.03);
            --theme-color: #fff;
        }

        html, body {
            background-color: #000;
            color: var(--text-color);
            font-family: 'Onest', sans-serif;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            overscroll-behavior: none;
        }

        .auth-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .logo {
            height: 40px; 
            margin-bottom: 30px;
            user-select: none;
            -webkit-user-drag: none;
        }

        .content-card {
            background-color: var(--card-background);
            border-radius: 15px;
            border: var(--glass-border);
            padding: 30px 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            position: relative;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        h2 {
            color: var(--text-color);
            font-size: 1.3rem;
            font-weight: 700;
            margin: 0 0 15px 0;
            display: block;
        }

        p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 25px;
            margin-top: 0;
        }

        .highlight {
            color: var(--theme-color);
            font-weight: 700;
        }

        .otp-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .otp-input {
            width: 50px;
            height: 65px;
            background: var(--input-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-family: 'Onest', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            text-align: center;
            outline: none;
            transition: all 0.2s ease;
            padding: 0;
            -moz-appearance: textfield;
        }

        .otp-input:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .otp-input::-webkit-outer-spin-button,
        .otp-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .token-textarea {
            width: 100%;
            box-sizing: border-box;
            background: var(--input-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 15px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-family: 'Onest', sans-serif;
            margin-bottom: 20px;
            outline: none;
            resize: none;
            height: 110px;
            line-height: 1.5;
            transition: all 0.2s ease;
        }

        .token-textarea:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .token-textarea::placeholder { color: #666; }

        .action-btn {
            background-color: #fff;
            color: #000;
            font-family: 'Onest', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            padding: 16px 0;
            width: 100%;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
            display: block;
        }

        .action-btn:active { transform: scale(0.98); }
        .action-btn:hover { box-shadow: 0 0 15px rgba(255,255,255,0.2); }
        .action-btn:disabled { 
            background-color: #333; 
            color: #555; 
            cursor: default; 
            box-shadow: none; 
            transform: none;
        }

        .helper-text {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.85rem;
            color: #888;
        }

        .helper-text a {
            color: var(--text-color);
            font-weight: 700;
            text-decoration: none;
            transition: opacity 0.2s;
        }
        
        .helper-text a:hover { opacity: 0.8; }

        .error-msg {
            background: rgba(255, 23, 68, 0.1);
            color: #ff1744;
            border: 1px solid rgba(255, 23, 68, 0.2);
            font-size: 0.85rem;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-weight: 600;
            text-align: center;
        }

        .hidden { display: none; }
        .fade-in { animation: fadeIn 0.4s ease forwards; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .success-icon {
            font-size: 3rem;
            color: #00e676;
            margin-bottom: 15px;
            display: block;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <img src="/assets/liveplay_logo_(white)_v2.svg" alt="Liveplay" class="logo">
        
        <div id="step-1" class="content-card fade-in">
            <h2>Enter TV Code</h2>
            <p>Enter the 5-digit code displayed on your TV.</p>
            
            <div id="error-1" class="error-msg"></div>
            
            <div class="otp-container" id="code-inputs">
                <input type="tel" class="otp-input" maxlength="1" pattern="[0-9]*" inputmode="numeric">
                <input type="tel" class="otp-input" maxlength="1" pattern="[0-9]*" inputmode="numeric">
                <input type="tel" class="otp-input" maxlength="1" pattern="[0-9]*" inputmode="numeric">
                <input type="tel" class="otp-input" maxlength="1" pattern="[0-9]*" inputmode="numeric">
                <input type="tel" class="otp-input" maxlength="1" pattern="[0-9]*" inputmode="numeric">
            </div>

            <button class="action-btn" id="btn-next">Continue</button>
        </div>

        <div id="step-2" class="content-card hidden">
            <h2>Authentication</h2>
            <p>Paste your access token to unlock <span class="highlight">WesleyVanneck's Channels</span>.</p>
            
            <div id="error-2" class="error-msg"></div>
            
            <textarea id="access-token" class="token-textarea" placeholder="Paste token here..."></textarea>
            
            <button class="action-btn" id="btn-submit">Connect TV</button>

            <div class="helper-text">
                How to get Token? Just visit<br>
                <a href="https://panel.nathcreqtives.com/register" target="_blank">panel.nathcreqtives.com</a>
            </div>
        </div>
        
        <div id="step-3" class="content-card hidden">
            <div class="success-icon">✓</div>
            <h2>Success!</h2>
            <p style="margin-bottom: 0;">Your TV is now authenticated.<br>Content will start playing automatically.</p>
        </div>

    </div>

    <script>
        const step1 = document.getElementById('step-1');
        const step2 = document.getElementById('step-2');
        const step3 = document.getElementById('step-3');
        const inputs = document.querySelectorAll('.otp-input');
        const inputToken = document.getElementById('access-token');
        const btnNext = document.getElementById('btn-next');
        const btnSubmit = document.getElementById('btn-submit');
        const err1 = document.getElementById('error-1');
        const err2 = document.getElementById('error-2');

        let fullCode = '';

        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if(e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if(e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
            
            if (index > 0) {
                input.addEventListener('paste', (e) => {
                    e.preventDefault();
                });
            }
        });

        inputs[0].addEventListener('paste', (e) => {
            e.preventDefault();
            const paste = (e.clipboardData || window.clipboardData).getData('text').trim();
            
            if(paste.length >= 5 && /^\d+$/.test(paste)) {
                inputs.forEach((inp, i) => {
                    if(i < 5) inp.value = paste[i];
                });
                inputs[4].focus();
            }
        });

        btnNext.addEventListener('click', () => {
            fullCode = '';
            inputs.forEach(inp => fullCode += inp.value);

            if(fullCode.length !== 5 || !/^\d+$/.test(fullCode)) {
                err1.innerText = "Please enter a valid 5-digit code.";
                err1.style.display = 'block';
                step1.animate([
                    { transform: 'translateX(0)' },
                    { transform: 'translateX(-5px)' },
                    { transform: 'translateX(5px)' },
                    { transform: 'translateX(0)' }
                ], { duration: 200 });
                return;
            }

            err1.style.display = 'none';
            step1.classList.add('hidden');
            step2.classList.remove('hidden');
            step2.classList.add('fade-in');
        });

        btnSubmit.addEventListener('click', async () => {
            const token = inputToken.value.trim();
            if(!token) {
                err2.innerText = "Please paste your token.";
                err2.style.display = 'block';
                return;
            }

            btnSubmit.disabled = true;
            btnSubmit.innerText = "Verifying...";
            err2.style.display = 'none';

            try {
                const res = await fetch('/api/auth/submitToken', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: fullCode, token: token })
                });

                const data = await res.json();

                if(res.ok) {
                    step2.classList.add('hidden');
                    step3.classList.remove('hidden');
                    step3.classList.add('fade-in');
                } else {
                    err2.innerText = data.error || "Invalid Code or Token.";
                    err2.style.display = 'block';
                    btnSubmit.disabled = false;
                    btnSubmit.innerText = "Connect TV";
                }

            } catch(e) {
                err2.innerText = "Connection error. Please try again.";
                err2.style.display = 'block';
                btnSubmit.disabled = false;
                btnSubmit.innerText = "Connect TV";
            }
        });
    </script>
</body>
</html>
