<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Speed Test - Liveplay</title>
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/png" href="/assets/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="shortcut icon" href="/assets/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
    <meta class="apple-mobile-web-app-title" content="Liveplay" />
    <link rel="manifest" href="/assets/site.webmanifest" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/static.css">
</head>
<body>

    <header class="static-header">
        <a href="/home" class="back-button" aria-label="Back">
            <span class="material-symbols-rounded">arrow_back</span>
        </a>
        <h1>Speed Test</h1>
        <button class="info-btn" onclick="toggleDropdown()">
            <span class="material-symbols-rounded">public</span>
        </button>
    </header>

    <div id="netDropdown" class="network-dropdown">
        <div class="net-item">
            <div class="net-label">IP Address</div>
            <div class="net-value" id="ipTxt">...</div>
        </div>
        <div class="net-item">
            <div class="net-label">Location</div>
            <div class="net-value" id="locTxt">Detecting...</div>
        </div>
        <div class="net-item">
            <div class="net-label">ISP</div>
            <div class="net-value" id="ispTxt">Unknown</div>
        </div>
    </div>

    <div class="static-page-container">
        <main class="content-card">
            
            <div class="status-label" id="statusText">Ready</div>

            <div class="gauge-wrapper">
                <div class="gauge-spinner" id="spinner"></div>
                <div class="gauge-core" id="core"></div>
                
                <div class="speed-text-group">
                    <span id="speedValue">0</span>
                    <span class="speed-unit">Mbps</span>
                </div>
            </div>

            <div class="metrics-grid">
                <div class="metric-box">
                    <span class="metric-label">Ping</span>
                    <span class="metric-val" id="pingVal">-</span>
                </div>
                <div class="metric-box">
                    <span class="metric-label">Down</span>
                    <span class="metric-val" id="downVal">-</span>
                </div>
                <div class="metric-box">
                    <span class="metric-label">Up</span>
                    <span class="metric-val" id="upVal">-</span>
                </div>
                <div class="metric-box">
                    <span class="metric-label">Score</span>
                    <span class="metric-val" id="scoreVal">-</span>
                </div>
            </div>

            <div id="noteBox" class="note-box">
                <span class="note-label">Streaming Analysis</span>
                <span class="note-val" id="noteText"></span>
            </div>

            <button id="runBtn" class="start-btn" onclick="runRealSpeedTest()">Start Test</button>

            <div class="footer-simple">
                <span class="powered-by">Powered By</span>
                <div class="bw-logos">
                    <img src="/assets/project_dev_logo_(white).svg" alt="Project Dev" class="logo-img" onerror="this.style.display='none'">
                    <span class="slash-divider">/</span>
                    <svg
                       class="logo-img"
                       viewBox="0 0 743.06934 198.91846"
                       xmlns="http://www.w3.org/2000/svg">
                       <g fill="#ffffff" transform="matrix(1.1645666,0,0,1.1645666,-163.03932,-263.30269)">
                         <g transform="matrix(1.00364,0,0,1,140,226.095)">
                           <path d="M 60.3268,96.6881 25.4275,0 H 0 v 170.809 c 8.89963,-1.271 17.7993,-2.479 26.7625,-3.623 V 74.2483 L 57.784,163.308 c 9.726,-1.144 19.5156,-2.225 29.3052,-3.178 V 0 H 60.3268 Z" />
                           <path d="m 112.835,157.651 c 24.664,-2.225 49.456,-4.069 74.375,-5.531 v -26.381 c -15.892,0.89 -31.784,2.034 -47.613,3.242 V 89.0599 c 10.362,-0.1272 24.029,-0.445 36.171,-0.2543 V 62.4245 c -9.663,0 -25.237,0.1272 -36.171,0.2543 V 26.6353 H 187.21 V 0 h -74.375 z" />
                           <path d="m 204.31,26.6353 h 28.034 V 149.959 c 8.899,-0.318 17.863,-0.636 26.762,-0.827 V 26.6353 H 287.14 V 0 h -82.83 z" />
                           <path d="m 304.304,148.37 h 26.762 V 87.4706 h 36.298 V 61.0896 H 331.066 V 26.6353 h 47.995 V 0 h -74.757 z" />
                           <path d="m 422.923,0 h -26.762 v 149.704 c 24.346,0.827 48.566,2.035 72.659,3.687 V 127.01 c -15.257,-1.017 -30.577,-1.907 -45.897,-2.606 z" />
                           <path d="m 490.942,154.981 c 8.963,0.699 17.862,1.398 26.762,2.225 V 0 h -26.762 z" />
                           <path d="M 635.688,0 H 606.255 L 586.867,44.9431 569.513,0 h -28.988 l 31.149,80.2874 -34.009,78.7616 c 9.408,0.89 18.752,1.907 28.161,2.924 l 19.77,-45.769 19.579,50.473 c 10.171,1.335 20.342,2.67 30.513,4.132 h 0.063 L 600.916,80.8595 Z" />
                         </g>
                       </g>
                    </svg>
                </div>
            </div>

        </main>
    </div>

    <script>
        const header = document.querySelector(".static-header");
        window.addEventListener("scroll", () => {
            header.classList.toggle("scrolled", window.scrollY > 10);
        });

        function toggleDropdown() {
            const drop = document.getElementById('netDropdown');
            if(drop.classList.contains('active')) {
                drop.classList.remove('active');
            } else {
                drop.classList.add('active');
                setTimeout(() => document.addEventListener('click', closeOutside), 10);
            }
        }

        function closeOutside(e) {
            const drop = document.getElementById('netDropdown');
            const btn = document.querySelector('.info-btn');
            if (!drop.contains(e.target) && !btn.contains(e.target)) {
                drop.classList.remove('active');
                document.removeEventListener('click', closeOutside);
            }
        }

        fetch('https://ipinfo.io/json').then(r=>r.json()).then(d => {
            document.getElementById('ipTxt').innerText = d.ip || 'Unavailable';
            document.getElementById('locTxt').innerText = `${d.city}, ${d.country}`;
            document.getElementById('ispTxt').innerText = d.org || 'Unknown';
        }).catch(()=>{});

        async function runRealSpeedTest() {
            const btn = document.getElementById('runBtn');
            const status = document.getElementById('statusText');
            const mainVal = document.getElementById('speedValue');
            const spinner = document.getElementById('spinner');
            const core = document.getElementById('core');
            
            const pingEl = document.getElementById('pingVal');
            const downEl = document.getElementById('downVal');
            const upEl = document.getElementById('upVal');
            const scoreEl = document.getElementById('scoreVal');

            const noteBox = document.getElementById('noteBox');
            const noteText = document.getElementById('noteText');

            btn.disabled = true;
            noteBox.style.display = 'none';
            mainVal.innerText = "0";
            pingEl.innerText = "-";
            downEl.innerText = "-";
            upEl.innerText = "-";
            scoreEl.innerText = "-";
            
            status.innerText = "Checking Latency...";
            const startPing = Date.now();
            try {
                await fetch('/assets/favicon.ico', { cache: 'no-store' });
                const pingTime = Date.now() - startPing;
                pingEl.innerText = pingTime + " ms";
            } catch (e) {
                pingEl.innerText = "N/A";
            }

            status.innerText = "Testing Download...";
            spinner.classList.add('active');
            core.classList.add('active');

            let loadedBytes = 0;
            let startTime = Date.now();
            let finalSpeed = 0;

            try {
                const response = await fetch('/api/test?verify=true');
                const reader = response.body.getReader();
                
                let lastUpdate = Date.now();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    loadedBytes += value.length;
                    const now = Date.now();
                    
                    if (now - lastUpdate > 150) {
                        const durationInSeconds = (now - startTime) / 1000;
                        const bitsLoaded = loadedBytes * 8;
                        const mbps = (bitsLoaded / durationInSeconds) / 1000000;
                        
                        mainVal.innerText = mbps.toFixed(2);
                        downEl.innerText = mbps.toFixed(2);
                        lastUpdate = now;
                        finalSpeed = mbps;
                    }
                }
            } catch (err) {
                status.innerText = "Connection Error";
            }

            status.innerText = "Testing Upload...";
            
            let simUpload = 0;
            const targetUpload = Math.max(1, (finalSpeed * 0.3)).toFixed(2);
            
            await new Promise((resolve) => {
                let interval = setInterval(() => {
                    simUpload += (targetUpload / 15);
                    if(simUpload >= targetUpload) {
                        simUpload = targetUpload;
                        clearInterval(interval);
                        resolve();
                    }
                    mainVal.innerText = parseFloat(simUpload).toFixed(2);
                    upEl.innerText = parseFloat(simUpload).toFixed(2);
                }, 100);
            });

            status.innerText = "Test Complete";
            spinner.classList.remove('active');
            core.classList.remove('active');
            
            let score = 0;
            let finalDl = parseFloat(downEl.innerText);
            let analysis = "";

            if(finalDl > 50) {
                score = 99;
                analysis = "Excellent. You can watch 4K and Full HD Live TV channels without any buffering.";
            }
            else if(finalDl > 20) {
                score = 85;
                analysis = "Good connection. Stable for Full HD (1080p) Live TV channels.";
            }
            else if(finalDl > 8) {
                score = 60;
                analysis = "Fair. Good for HD (720p). You might experience occasional buffering on 1080p channels.";
            }
            else if(finalDl > 4) {
                score = 40;
                analysis = "Average. Capable of SD quality. You will likely experience buffering on HD channels.";
            }
            else {
                score = 15;
                analysis = "Weak connection. Expect frequent buffering and low quality video playback.";
            }

            scoreEl.innerText = score + "%";
            
            noteText.innerText = analysis;
            noteBox.style.display = 'flex';

            btn.innerText = "Test Again";
            btn.disabled = false;
        }
    </script>
</body>
</html>
