<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Liveplay for TV</title>
    <script>
        if (!navigator.userAgent.match(/SmartTV|Tizen|Web0S|BRAVIA|NetCast|GoogleTV|AppleTV|HbbTV/i)) {
            window.location.replace('/404');
        }
    </script>
    <meta name="theme-color" content="#000000">
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;800&display=swap">
    <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.12/dist/shaka-player.ui.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.12/dist/controls.min.css" rel="stylesheet">
    
    <style>
        :root {
            --focus-bg: #ffffff;
            --focus-text: #000000;
            --glass-heavy: #000000;
            --theme-color: #ffffff;
            --container-bg: rgba(255,255,255,0.05);
            --border-color: rgba(255,255,255,0.15);
            --border-radius: 15px;
            --card-background: #1a1a1a;
        }

        body {
            margin: 0; padding: 0; overflow: hidden; background: #000;
            cursor: default; font-family: 'Onest', sans-serif; color: white;
            -webkit-font-smoothing: antialiased;
        }

        #tv-player-container {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 1; background: #000;
        }
        video { width: 100%; height: 100%; object-fit: fill; }
        video::cue { font-family: 'Onest', sans-serif; text-align: center; line-height: 1.4; }
        
        .loader-overlay {
            position: fixed; inset: 0; background: black; z-index: 50;
            display: flex; justify-content: center; align-items: center;
            transition: opacity 0.5s; pointer-events: none;
        }
        .loader-overlay.hidden { opacity: 0; }
        .spinner {
            width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid white; border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .glass-panel {
            background: var(--glass-heavy);
            border: 1px solid var(--border-color);
            box-shadow: 5px 0 30px rgba(0,0,0,0.8);
            color: white;
            position: fixed; top: 20px; bottom: 20px;
            width: 380px; border-radius: 20px;
            z-index: 200;
            display: flex; flex-direction: column;
            transform: translate3d(-120%, 0, 0); 
            will-change: transform; transition: transform 0.3s ease-out;
            box-sizing: border-box; overflow: hidden;
        }
        #guide-overlay { left: 20px; }
        #guide-overlay.active { transform: translate3d(0, 0, 0); }
        #settings-overlay { right: 20px; transform: translate3d(120%, 0, 0); }
        #settings-overlay.active { transform: translate3d(0, 0, 0); }

        .scrollable-content { flex: 1; overflow-y: auto; padding: 20px; scrollbar-width: none; position: relative; }
        .scrollable-content::-webkit-scrollbar { display: none; }

        .guide-header, .settings-header { 
            padding: 25px; border-bottom: 1px solid var(--border-color); 
            display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; 
        }
        .guide-logo { height: 28px; }
        #clock-display { font-size: 0.9rem; color: #888; font-weight: 600; }

        .list-group-container { background: var(--container-bg); border-radius: 15px; overflow: hidden; border: 1px solid var(--border-color); display: flex; flex-direction: column; }
        .list-item { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; border-bottom: 1px solid var(--border-color); cursor: pointer; transition: background 0.1s; position: relative; }
        .list-item:last-child { border-bottom: none; }
        .list-item-left { display: flex; align-items: center; gap: 15px; }
        .list-item img { width: 32px; height: 32px; object-fit: contain; border-radius: 5.5px; }
        .list-item span { font-weight: 500; font-size: 0.9rem; }
        
        .focusable.focused { background: var(--focus-bg); color: var(--focus-text); z-index: 2; }
        .focusable.focused .item-icon, .focusable.focused .selected-check { color: var(--focus-text); }

        .section-header, .settings-title { text-align: left; text-transform: uppercase; font-size: 0.8rem; color: #888; font-weight: 700; margin: 20px 0 10px; }

        .channel-info-bar {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 180px;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 10%, rgba(0,0,0,0) 100%);
            z-index: 200; padding: 40px; box-sizing: border-box;
            display: flex; align-items: flex-end;
            transform: translate3d(0, 100%, 0); opacity: 0;
            transition: transform 0.4s ease-out, opacity 0.4s;
            pointer-events: none;
        }
        .channel-info-bar.visible { transform: translate3d(0, 0, 0); opacity: 1; }
        .info-content { display: flex; align-items: center; gap: 20px; }
        #info-logo { height: 70px; width: 70px; object-fit: contain; background: var(--card-background); border-radius: 12px; padding: 8px; }
        .text-details h1 { font-size: 2.2rem; margin: 0; font-weight: 800; }
        .meta-row { display: flex; align-items: center; gap: 10px; color: #ccc; }
        .live-tag { background: #fff; color: #000; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 800; display: flex; align-items: center; gap: 4px; }

        .top-watch-section { margin-top: 20px; }
        .top-watch-list { display: flex; gap: 14px; overflow-x: auto; padding: 5px 0; scrollbar-width: none; }
        .top-watch-item { display: flex; align-items: center; flex-shrink: 0; position: relative; border-radius: 50%; }
        .top-rank-number { height: 55px; width: 65px; margin-right: -36.5px; z-index: 1; pointer-events: none; }
        .top-watch-logo-container { background: var(--card-background); width: 70px; height: 70px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid rgba(255,255,255,0.1); overflow: hidden; z-index: 5; }
        .top-watch-item.focusable.focused .top-watch-logo-container { background: var(--focus-bg); }
        .top-watch-logo { width: 80%; height: 50%; object-fit: contain; }

        .tv-slider-container { position: relative; width: 100%; padding-bottom: 56.25%; border-radius: 15px; overflow: hidden; background: #111; }
        .tv-slide { position: absolute; inset: 0; opacity: 0; transition: opacity 0.5s; }
        .tv-slide.active { opacity: 1; }
        .tv-slide-bg { width: 100%; height: 100%; object-fit: cover; }
        .tv-slide-content { position: absolute; bottom: 15px; left: 15px; right: 20px; z-index: 2; }
        .tv-slide-content h2 { font-size: 1rem; margin: 0 0 4px 0; }
        .tv-slide-content p { color: #ccc; font-size: 0.6rem; margin: 0; }

        .virtual-remote-container { position: fixed; bottom: 40px; right: 40px; z-index: 500; opacity: 0.2; transition: opacity 0.3s; }
        .virtual-remote-container:hover { opacity: 1; }
        .d-pad { position: relative; width: 140px; height: 140px; background: rgba(30, 30, 30, 0.6); border-radius: 50%; border: 1px solid rgba(255,255,255,0.15); }
        .d-btn { position: absolute; width: 45px; height: 45px; border-radius: 50%; background: transparent; color: white; display: flex; justify-content: center; align-items: center; border: none; }
        .d-btn.up { top: 5px; left: 50%; transform: translateX(-50%); }
        .d-btn.down { bottom: 5px; left: 50%; transform: translateX(-50%); }
        .d-btn.left { left: 5px; top: 50%; transform: translateY(-50%); }
        .d-btn.right { right: 5px; top: 50%; transform: translateY(-50%); }
        .d-btn.center { top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(255,255,255,0.1); width: 50px; height: 50px; }
    </style>
    <style id="dynamic-caption-style"></style>
</head>
<body>

    <div id="tv-player-container">
        <video id="video" autoplay playsinline></video>
    </div>

    <div id="tv-loader" class="loader-overlay">
        <div class="spinner"></div>
    </div>

    <div id="channel-info-bar" class="channel-info-bar">
        <div class="info-content">
            <img id="info-logo" src="" alt="Logo">
            <div class="text-details">
                <h1 id="info-name">Loading...</h1>
                <div class="meta-row">
                    <span id="info-group">TV</span>
                    <span>•</span>
                    <div class="live-tag"><span class="material-symbols-rounded" style="font-size: 16px;">sensors</span> LIVE</div>
                    <span>•</span>
                    <span id="info-time">00:00</span>
                </div>
            </div>
        </div>
    </div>

    <div id="guide-overlay" class="glass-panel">
        <div class="guide-header">
            <img src="/assets/liveplay_logo_(white)_v2.svg" alt="Liveplay" class="guide-logo">
            <div id="clock-display">12:00 PM</div>
        </div>
        <div class="scrollable-content">
            <div class="tv-slider-container" id="tv-slider"></div>
            <div class="top-watch-section" id="top-watch-section" style="display:none;">
                <div class="section-header">Top 10 Live TV</div>
                <div class="top-watch-list" id="top-watch-list"></div>
            </div>
            <h3 class="section-header">All Channels</h3>
            <div class="list-group-container" id="channel-list"></div>
        </div>
    </div>

    <div id="settings-overlay" class="glass-panel right-panel">
        <div class="settings-header"><h2>Settings</h2></div>
        <div class="scrollable-content">
            <div class="settings-title">Video Quality</div>
            <div class="list-group-container" id="quality-list"></div>
            <div class="settings-title">Playback Speed</div>
            <div class="list-group-container" id="speed-list"></div>
        </div>
    </div>

    <div class="virtual-remote-container">
        <div class="d-pad">
            <button class="d-btn up" id="remote-up"><span class="material-symbols-rounded">keyboard_arrow_up</span></button>
            <button class="d-btn left" id="remote-left"><span class="material-symbols-rounded">keyboard_arrow_left</span></button>
            <button class="d-btn center" id="remote-ok"><span class="material-symbols-rounded">circle</span></button>
            <button class="d-btn right" id="remote-right"><span class="material-symbols-rounded">keyboard_arrow_right</span></button>
            <button class="d-btn down" id="remote-down"><span class="material-symbols-rounded">keyboard_arrow_down</span></button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const API_GET_CHANNELS = '/api/getChannels';
            const API_GET_DATA = '/api/getData';
            const API_GET_SLIDES = '/api/getSlides';
            const API_GET_TOP_CHANNELS = '/api/getTopChannels';
            const API_INCREMENT_VIEW = '/api/incrementView';

            let allChannels = [];
            let currentChannelIndex = 0;
            let currentScope = 'player';
            let focusIndex = 0;
            let focusList = [];
            let player = null;
            let infoTimeout = null;
            let slideInterval = null;

            const els = {
                video: document.getElementById('video'),
                guide: document.getElementById('guide-overlay'),
                settings: document.getElementById('settings-overlay'),
                info: document.getElementById('channel-info-bar'),
                slider: document.getElementById('tv-slider'),
                topSection: document.getElementById('top-watch-section'),
                topList: document.getElementById('top-watch-list'),
                channelList: document.getElementById('channel-list'),
                loader: document.getElementById('tv-loader'),
                name: document.getElementById('info-name'),
                logo: document.getElementById('info-logo'),
                group: document.getElementById('info-group'),
                time: document.getElementById('info-time'),
                qualityList: document.getElementById('quality-list'),
                speedList: document.getElementById('speed-list')
            };

            function updateTime() {
                const now = new Date();
                const str = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                document.getElementById('clock-display').textContent = str;
                els.time.textContent = str;
            }
            setInterval(updateTime, 1000);
            updateTime();

            async function init() {
                shaka.polyfill.installAll();
                if(shaka.Player.isBrowserSupported()) {
                    player = new shaka.Player(els.video);
                    player.configure({ 
                        streaming: { bufferingGoal: 60, rebufferingGoal: 2, jumpLargeGaps: true },
                        abr: { enabled: true }
                    });
                    player.addEventListener('buffering', (e) => {
                        e.buffering ? els.loader.classList.remove('hidden') : els.loader.classList.add('hidden');
                    });
                }
                try {
                    const [channels, slides, topData] = await Promise.all([
                        fetch(API_GET_CHANNELS).then(r => r.json()),
                        fetch(API_GET_SLIDES).then(r => r.json()).catch(() => []),
                        fetch(API_GET_TOP_CHANNELS).then(r => r.json()).catch(() => [])
                    ]);
                    allChannels = Array.isArray(channels) ? channels : [];
                    renderGuide(allChannels, slides, topData);
                    if(allChannels.length) playChannel(0);
                    else els.loader.classList.add('hidden');
                } catch(e) { console.error(e); els.loader.classList.add('hidden'); }
            }

            async function playChannel(idx) {
                if(idx < 0 || idx >= allChannels.length) return;
                currentChannelIndex = idx;
                const ch = allChannels[idx];
                
                els.name.textContent = ch.name;
                els.group.textContent = ch.group || 'Live TV';
                els.logo.src = ch.logo || '/assets/favicon.svg';
                
                els.info.classList.add('visible');
                clearTimeout(infoTimeout);
                infoTimeout = setTimeout(() => els.info.classList.remove('visible'), 5000);

                els.loader.classList.remove('hidden');
                const slug = ch.name.toLowerCase().replace(/\s+/g, '-');
                fetch(`${API_INCREMENT_VIEW}?channel=${encodeURIComponent(slug)}`, {method: 'POST'}).catch(()=>{});

                try {
                    await player.unload();
                    const res = await fetch(`${API_GET_DATA}?channel=${encodeURIComponent(ch.name)}`);
                    const data = await res.json();
                    
                    let clearKeys = null;
                    if(data.ClearKey?.k1 && data.ClearKey?.k2) {
                        clearKeys = { [data.ClearKey.k1]: data.ClearKey.k2 };
                    }

                    player.configure({ drm: { clearKeys: clearKeys || {} } });
                    await player.load(data.manifestUri);
                    await els.video.play();
                    els.loader.classList.add('hidden');
                } catch(e) { 
                    console.error(e); 
                    els.name.textContent = "Stream Offline"; 
                    els.loader.classList.add('hidden'); 
                }
            }

            function renderGuide(channels, slides, topData) {
                els.slider.innerHTML = '';
                if(slides?.length) {
                    slides.forEach((s, i) => {
                        const slide = document.createElement('div');
                        slide.className = `tv-slide ${i===0?'active':''}`;
                        slide.innerHTML = `<img src="${s.image}" class="tv-slide-bg"><div class="tv-slide-content"><h2>${s.title}</h2><p>${s.description}</p></div>`;
                        els.slider.appendChild(slide);
                    });
                }

                if(topData?.length) {
                    els.topSection.style.display = 'block';
                    topData.slice(0, 10).forEach((slug, i) => {
                        let ch = channels.find(c => c.name.toLowerCase().replace(/\s+/g, '-') === slug);
                        if(!ch) return;
                        const item = document.createElement('div');
                        item.className = 'top-watch-item focusable is-top-item';
                        item.innerHTML = `<img src="/assets/ranks/${i+1}.svg" class="top-rank-number"><div class="top-watch-logo-container"><img src="${ch.logo}" class="top-watch-logo"></div>`;
                        item.onclick = () => { playChannel(channels.indexOf(ch)); toggleGuide(false); };
                        els.topList.appendChild(item);
                    });
                }

                els.channelList.innerHTML = '';
                channels.forEach((ch, idx) => {
                    const row = document.createElement('div');
                    row.className = 'list-item focusable is-list-item';
                    row.innerHTML = `<div class="list-item-left"><img src="${ch.logo || '/assets/favicon.svg'}"><span>${ch.name}</span></div><span class="material-symbols-rounded">sensors</span>`;
                    row.onclick = () => { playChannel(idx); toggleGuide(false); };
                    els.channelList.appendChild(row);
                });
            }

            function toggleGuide(show) {
                if(show) { 
                    els.guide.classList.add('active'); 
                    currentScope = 'guide'; 
                    focusList = Array.from(els.guide.querySelectorAll('.focusable'));
                    focusIndex = focusList.findIndex(el => el.dataset.index == currentChannelIndex) || 0;
                    updateFocus(); 
                } else { 
                    els.guide.classList.remove('active'); 
                    currentScope = 'player'; 
                }
            }

            function toggleSettings(show) {
                if(show) { 
                    els.settings.classList.add('active'); 
                    currentScope = 'settings'; 
                    renderSettings(); 
                } else { 
                    els.settings.classList.remove('active'); 
                    currentScope = 'player'; 
                }
            }

            function renderSettings() {
                els.qualityList.innerHTML = '';
                const tracks = player.getVariantTracks();
                const createBtn = (txt, active, cb) => {
                    const div = document.createElement('div');
                    div.className = 'list-item focusable';
                    div.innerHTML = `<span>${txt}</span>${active ? '<span class="material-symbols-rounded">check</span>' : ''}`;
                    div.onclick = cb;
                    return div;
                };

                els.qualityList.appendChild(createBtn('Auto', player.getConfiguration().abr.enabled, () => {
                    player.configure({ abr: { enabled: true } });
                    toggleSettings(false);
                }));

                [...new Set(tracks.map(t => t.height))].sort((a,b)=>b-a).forEach(h => {
                    els.qualityList.appendChild(createBtn(`${h}p`, false, () => {
                        player.configure({ abr: { enabled: false } });
                        player.selectVariantTrack(tracks.find(t => t.height === h), true);
                        toggleSettings(false);
                    }));
                });

                focusList = Array.from(els.settings.querySelectorAll('.focusable'));
                focusIndex = 0;
                updateFocus();
            }

            function updateFocus() {
                document.querySelectorAll('.focused').forEach(el => el.classList.remove('focused'));
                const el = focusList[focusIndex];
                if(el) {
                    el.classList.add('focused');
                    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }

            function handleInput(key) {
                if(currentScope === 'player') {
                    if(key === 'ArrowUp') playChannel((currentChannelIndex - 1 + allChannels.length) % allChannels.length);
                    else if(key === 'ArrowDown') playChannel((currentChannelIndex + 1) % allChannels.length);
                    else if(key === 'ArrowLeft') toggleGuide(true);
                    else if(key === 'ArrowRight') toggleSettings(true);
                } else {
                    if(key === 'ArrowUp' && focusIndex > 0) focusIndex--;
                    else if(key === 'ArrowDown' && focusIndex < focusList.length - 1) focusIndex++;
                    else if(key === 'Enter') focusList[focusIndex]?.click();
                    else if(key === 'Back' || key === 'ArrowRight' && currentScope === 'guide' || key === 'ArrowLeft' && currentScope === 'settings') {
                        toggleGuide(false); toggleSettings(false);
                    }
                    updateFocus();
                }
            }

            document.addEventListener('keydown', e => {
                const map = { 'ArrowUp':'ArrowUp', 'ArrowDown':'ArrowDown', 'ArrowLeft':'ArrowLeft', 'ArrowRight':'ArrowRight', 'Enter':'Enter', 'Escape':'Back', 'Backspace':'Back' };
                if(map[e.key]) { e.preventDefault(); handleInput(map[e.key]); }
            });

            init();
        });
    </script>
</body>
</html>
