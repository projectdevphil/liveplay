<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Liveplay TV</title>
    <meta name="theme-color" content="#000000">
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    
    <!-- Fonts and Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    
    <!-- Shaka Player -->
    <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.12/dist/shaka-player.ui.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.12/dist/controls.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="/css/style.css">

    <style>
        /* --- TV INTERFACE STYLES --- */

        :root {
            --focus-bg: #ffffff;
            --focus-text: #000000;
            --glass-heavy: rgba(15, 15, 15, 0.95);
            --theme-color: #ffffff;
            --container-bg: rgba(255,255,255,0.05);
            --border-color: rgba(255,255,255,0.1);
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
            cursor: default; 
            font-family: 'BR Sonoma', sans-serif;
            color: white;
            -webkit-font-smoothing: antialiased;
        }

        /* Fullscreen Player */
        #tv-player-container {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 1; background: #000;
        }
        video { width: 100%; height: 100%; object-fit: contain; }

        /* Common Panel Styles (Left & Right) */
        .glass-panel {
            background: var(--glass-heavy);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            color: white;
            position: fixed;
            top: 20px; bottom: 20px;
            width: 380px;
            border-radius: 20px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-sizing: border-box;
        }

        /* Scrollbar Hiding */
        .scrollable-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none; /* IE/Edge */
        }
        .scrollable-content::-webkit-scrollbar { display: none; } /* Chrome/Safari */

        /* --- LEFT GUIDE OVERLAY --- */
        #guide-overlay {
            left: 20px;
            transform: translateX(-120%);
        }
        #guide-overlay.active { transform: translateX(0); }

        .guide-header {
            padding: 25px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .guide-logo { height: 28px; }
        #clock-display { font-size: 0.9rem; color: #888; font-weight: 600; font-variant-numeric: tabular-nums; }

        /* --- RIGHT SETTINGS OVERLAY --- */
        #settings-overlay {
            right: 20px;
            transform: translateX(120%);
        }
        #settings-overlay.active { transform: translateX(0); }

        .settings-header {
            padding: 25px;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }
        .settings-header h2 { margin: 0; font-size: 1.2rem; }
        
        .section-header {
            text-align: left;
            text-transform: uppercase;
            font-size: 0.75rem;
            color: #888;
            font-weight: 700;
            margin: 25px 0 15px 0;
        }

        .settings-title {
            text-transform: uppercase;
            font-size: 0.75rem;
            color: #888;
            font-weight: 700;
            margin: 25px 0 10px 10px;
        }

        /* The Container Box */
        .list-group-container {
            background: var(--container-bg);
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        /* The Items inside */
        .list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }
        .list-item:last-child { border-bottom: none; }

        .list-item-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .list-item img {
            width: 32px; height: 32px;
            object-fit: contain;
            pointer-events: none;
            background: var(--focus-text);
            border: var(--glass-border);
            border-radius: 5.5px;
            padding: 2px;
        }
        
        .list-item span {
            font-weight: 500;
            font-size: 0.95rem;
        }

        .item-icon { font-size: 20px; color: #aaa; }
        
        /* Focus State */
        .focusable.focused {
            background: var(--focus-bg);
            color: var(--focus-text);
            z-index: 2;
        }
        .focusable.focused .item-icon { color: var(--focus-text); }
        .focusable.focused .channel-sensor { color: var(--focus-text); opacity: 1; }
        
        /* --- SLIDER --- */
        .tv-slider-container {
            margin-bottom: 10px;
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        .tv-slide {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; transition: opacity 0.5s ease 1s;
        }
        .tv-slide-bg { width: 100%; height: 100%; object-fit: cover; position: absolute; }
        
        .tv-slide-wipe-wrapper {
            position: absolute; inset: 0;
            clip-path: inset(0 0 0 100%);
            transition: clip-path 0.1s ease 1s;
        }
        .tv-slide-content {
            position: absolute; bottom: 20px; left: 20px; right: 20px;
            z-index: 2; opacity: 0; transform: translateY(20px);
            transition: all 0.5s ease;
        }
        .tv-slide-content h2 { font-size: 1.0rem; font-weight: 700; margin: 0 50px 2px 0;}
        .tv-slide-content p { color: var(--text-secondary); font-size: 0.6rem; line-height: 1.3; margin: 0 0 6px 0; }
        .tv-slide-badge {
            background: var(--theme-color); color: black;
            font-size: 0.4rem; font-weight: 700; padding: 3px;
            border-radius: 4px; display: inline-block;
        }
        .tv-slide-overlay {
            position: absolute; inset: 0;
            background: radial-gradient(circle at top right, transparent 35%, black 100%);
        }

        .tv-slide.active { opacity: 1; z-index: 1; transition: opacity 0.2s ease; }
        .tv-slide.active .tv-slide-wipe-wrapper {
            clip-path: inset(0 0 0 0);
            transition: clip-path 1.2s cubic-bezier(0.65, 0, 0.35, 1);
        }
        .tv-slide.active .tv-slide-content {
            opacity: 1; transform: translateY(0);
            transition: all 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) 0.6s;
        }
        .slider-dots {
            position: absolute; bottom: 10px; right: 15px;
            display: flex; gap: 4px; z-index: 5; padding: 5px; border: var(--glass-border); border-radius: 20px;
        }
        .dot {
            width: 7px; height: 7px; background: rgba(255,255,255,0.4);
            border-radius: 50%; transition: all 0.3s;
        }
        .dot.active { width: 20px; rgba(255, 255, 255, 0.2) border-radius: 10px; }

        .dot.active::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background-color: var(--theme-color);
            border-radius: 10px;
            width: 0%;
            animation: dotProgress var(--slide-timer, 5000ms) linear forwards;
        }
        
        @keyframes dotProgress {
            from { width: 0%; }
            to { width: 100%; }
        }        
        
        /* --- INFO BAR --- */
        .channel-info-bar {
            position: fixed; bottom: 0; left: 0; width: 100%;
            height: 180px;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 10%, rgba(0,0,0,0) 100%);
            z-index: 10; padding: 40px; box-sizing: border-box;
            display: flex; align-items: flex-end;
            transform: translateY(100%); opacity: 0;
            transition: transform 0.5s cubic-bezier(0.19, 1, 0.22, 1), opacity 0.4s;
            pointer-events: none;
        }
        .channel-info-bar.visible { transform: translateY(0); opacity: 1; }
        .info-content { display: flex; align-items: center; gap: 20px; }
        #info-logo {
            height: 70px; width: 70px; object-fit: contain;
            background: rgba(255,255,255,0.05); border-radius: 12px; padding: 8px;
            border: 1px solid var(--border-color);
        }
        .text-details h1 { font-size: 2.2rem; margin: 0 0 5px 0; font-weight: 800; }
        .meta-row { display: flex; align-items: center; gap: 10px; font-size: 1rem; color: #ccc; }
        .live-tag {
            background: #ff0000; color: white; padding: 2px 8px;
            border-radius: 4px; font-size: 0.75rem; font-weight: 800;
            display: flex; align-items: center; gap: 4px;
        }
        .channel-sensor { color: var(--theme-color); opacity: 0.7; font-size: 18px; }
        .channel-sensor.offline { color: #ff3b30; }

        /* --- LOADER --- */
        .loader-overlay {
            position: fixed; inset: 0; background: black; z-index: 9999;
            display: flex; justify-content: center; align-items: center;
            transition: opacity 0.5s; pointer-events: none;
        }
        .loader-overlay.hidden { opacity: 0; }
        .spinner {
            width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid white; border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Virtual Remote */
        .virtual-remote-container {
            position: fixed; bottom: 40px; right: 40px; z-index: 500;
            opacity: 0.3; transition: opacity 0.3s;
        }
        .virtual-remote-container:hover { opacity: 1; }
        .d-pad {
            position: relative; width: 140px; height: 140px;
            background: rgba(30, 30, 30, 0.6); border-radius: 50%;
            backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.15);
        }
        .d-btn {
            position: absolute; width: 45px; height: 45px;
            border-radius: 50%; background: transparent; color: white;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; border: none; outline: none;
        }
        .d-btn:active { background: rgba(255,255,255,0.2); }
        .d-btn.up { top: 5px; left: 50%; transform: translateX(-50%); }
        .d-btn.down { bottom: 5px; left: 50%; transform: translateX(-50%); }
        .d-btn.left { left: 5px; top: 50%; transform: translateY(-50%); }
        .d-btn.right { right: 5px; top: 50%; transform: translateY(-50%); }
        .d-btn.center { 
            top: 50%; left: 50%; transform: translate(-50%, -50%); 
            background: rgba(255,255,255,0.1); width: 50px; height: 50px;
        }
    </style>
</head>
<body>

    <div id="tv-player-container">
        <video id="video" autoplay playsinline></video>
    </div>

    <!-- Info Bar -->
    <div id="channel-info-bar" class="channel-info-bar">
        <div class="info-content">
            <img id="info-logo" src="" alt="Channel Logo">
            <div class="text-details">
                <h1 id="info-name">Loading...</h1>
                <div class="meta-row">
                    <span id="info-group">TV</span>
                    <span>•</span>
                    <div class="live-tag"><span class="material-symbols-rounded" style="font-size: 16px;">sensors</span> LIVE</div>
                    <span>•</span>
                    <span id="info-time">00:00</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Left Guide -->
    <div id="guide-overlay" class="glass-panel">
        <div class="guide-header">
            <img src="/assets/liveplay_logo_(white).png" alt="Liveplay" class="guide-logo">
            <div id="clock-display">12:00 PM</div>
        </div>
        <div class="scrollable-content">
            <div class="tv-slider-container" id="tv-slider"></div>
            
            <h3 class="section-header">All Channels</h3>
            
            <div class="list-group-container" id="channel-list">
                <!-- Channels injected here -->
            </div>
        </div>
    </div>

    <!-- Right Settings -->
    <div id="settings-overlay" class="glass-panel right-panel">
        <div class="settings-header">
            <h2>Stream Settings</h2>
        </div>
        <div class="scrollable-content">
            
            <div class="settings-title">Video Quality</div>
            <div class="list-group-container" id="quality-list"></div>

            <div id="audio-group-wrapper" style="display:none;">
                <div class="settings-title">Audio Track</div>
                <div class="list-group-container" id="audio-list"></div>
            </div>

            <div id="caption-group-wrapper" style="display:none;">
                <div class="settings-title">Captions</div>
                <div class="list-group-container" id="caption-list"></div>
            </div>

            <div class="settings-title">Playback Speed</div>
            <div class="list-group-container" id="speed-list"></div>

        </div>
    </div>

    <!-- Loader -->
    <div id="tv-loader" class="loader-overlay">
        <div class="spinner"></div>
    </div>

    <!-- Remote -->
    <div class="virtual-remote-container">
        <div class="d-pad">
            <button class="d-btn up" id="remote-up"><span class="material-symbols-rounded">keyboard_arrow_up</span></button>
            <button class="d-btn left" id="remote-left"><span class="material-symbols-rounded">keyboard_arrow_left</span></button>
            <button class="d-btn center" id="remote-ok"><span class="material-symbols-rounded">circle</span></button>
            <button class="d-btn right" id="remote-right"><span class="material-symbols-rounded">keyboard_arrow_right</span></button>
            <button class="d-btn down" id="remote-down"><span class="material-symbols-rounded">keyboard_arrow_down</span></button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            
            // --- Config ---
            const API_GET_CHANNELS = '/api/getChannels';
            const API_GET_DATA = '/api/getData';
            const API_GET_SLIDES = '/api/getSlides';
            
            // --- State ---
            let allChannels = [];
            let currentChannelIndex = 0;
            let currentScope = 'player'; // 'player', 'guide', 'settings'
            let focusIndex = 0;
            let focusList = [];
            let player = null;
            let infoTimeout = null;
            let slideInterval = null;

            // --- Elements ---
            const els = {
                video: document.getElementById('video'),
                guide: document.getElementById('guide-overlay'),
                settings: document.getElementById('settings-overlay'),
                info: document.getElementById('channel-info-bar'),
                slider: document.getElementById('tv-slider'),
                channelList: document.getElementById('channel-list'),
                loader: document.getElementById('tv-loader'),
                
                // Info
                name: document.getElementById('info-name'),
                logo: document.getElementById('info-logo'),
                group: document.getElementById('info-group'),
                time: document.getElementById('info-time'),
                
                // Settings Lists
                qualityList: document.getElementById('quality-list'),
                audioList: document.getElementById('audio-list'),
                captionList: document.getElementById('caption-list'),
                speedList: document.getElementById('speed-list'),
                
                // Setting Wrappers
                audioWrapper: document.getElementById('audio-group-wrapper'),
                captionWrapper: document.getElementById('caption-group-wrapper')
            };

            // --- Clock ---
            function updateTime() {
                const now = new Date();
                const str = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                document.getElementById('clock-display').textContent = str;
                els.time.textContent = str;
            }
            setInterval(updateTime, 1000);
            updateTime();

            // --- Init ---
            async function init() {
                shaka.polyfill.installAll();
                if(shaka.Player.isBrowserSupported()) {
                    player = new shaka.Player(els.video);
                    player.configure({ drm: { servers: {}, clearKeys: {} } });
                    player.addEventListener('error', e => console.error(e));
                }

                try {
                    const [channels, slides] = await Promise.all([
                        fetch(API_GET_CHANNELS).then(r => r.json()),
                        fetch(API_GET_SLIDES).then(r => r.json()).catch(() => [])
                    ]);
                    
                    allChannels = Array.isArray(channels) ? channels : [];
                    renderGuide(allChannels, slides);
                    
                    els.loader.classList.add('hidden');
                    if(allChannels.length) playChannel(0);

                } catch(e) { console.error(e); els.loader.classList.add('hidden'); }
            }

            // --- Rendering ---
            function renderGuide(channels, slides) {
                // Render Slider
                els.slider.innerHTML = '';
                if(slides && slides.length) {
                    const dotsCont = document.createElement('div');
                    dotsCont.className = 'slider-dots';
                    
                    slides.forEach((s, i) => {
                        const slide = document.createElement('div');
                        slide.className = `tv-slide ${i===0?'active':''}`;
                        slide.innerHTML = `
                            <div class="tv-slide-wipe-wrapper">
                                <img src="${s.image}" class="tv-slide-bg">
                                <div class="tv-slide-overlay"></div>
                                <div class="tv-slide-content">
                                    <h2>${s.title}</h2>
                                    <p>${s.description}</p>
                                    <div class="tv-slide-badge">${s.badge}</div>
                                </div>
                            </div>
                        `;
                        els.slider.appendChild(slide);
                        
                        const dot = document.createElement('button');
                        dot.className = `dot ${i===0?'active':''}`;
                        dotsCont.appendChild(dot);
                    });
                    els.slider.appendChild(dotsCont);

                    // Slider Loop
                    let currentSlide = 0;
                    const allSlides = els.slider.querySelectorAll('.tv-slide');
                    const allDots = els.slider.querySelectorAll('.dot');
                    if(allSlides.length > 1) {
                        slideInterval = setInterval(() => {
                            allSlides[currentSlide].classList.remove('active');
                            allDots[currentSlide].classList.remove('active');
                            currentSlide = (currentSlide + 1) % allSlides.length;
                            allSlides[currentSlide].classList.add('active');
                            allDots[currentSlide].classList.add('active');
                        }, 5000);
                    }
                } else {
                    els.slider.style.display = 'none';
                }

                // Render Channel List
                els.channelList.innerHTML = '';
                channels.forEach((ch, idx) => {
                    const row = document.createElement('div');
                    row.className = 'list-item focusable';
                    row.dataset.index = idx;
                    const logo = ch.logo || '/assets/favicon.svg';
                    const isOffline = ch.status === 'offline';
                    
                    row.innerHTML = `
                        <div class="list-item-left">
                            <img src="${logo}" onerror="this.style.opacity=0">
                            <span>${ch.name}</span>
                        </div>
                        <span class="material-symbols-rounded channel-sensor ${isOffline ? 'offline' : ''}">sensors</span>
                    `;
                    row.onclick = () => { playChannel(idx); toggleGuide(false); };
                    els.channelList.appendChild(row);
                });
            }

            function getResIcon(height) {
                if(!height) return 'auto_awesome';
                if(height >= 2160) return '4k';
                if(height >= 720) return 'hd';
                return 'sd';
            }

            function createSettingBtn(icon, text, onClick) {
                const div = document.createElement('div');
                div.className = 'list-item focusable';
                div.innerHTML = `
                    <div class="list-item-left">
                        <span class="material-symbols-rounded item-icon">${icon}</span>
                        <span>${text}</span>
                    </div>
                `;
                if(onClick) div.onclick = onClick;
                return div;
            }

            function renderSettings() {
                // Quality
                const tracks = player.getVariantTracks();
                const qList = els.qualityList;
                qList.innerHTML = '';
                
                // Auto
                qList.appendChild(createSettingBtn('hdr_auto', 'Auto', () => {
                    player.configure({ abr: { enabled: true } });
                    toggleSettings(false);
                }));

                // Resolutions
                const unique = [...new Set(tracks.map(t => t.height))].sort((a,b) => b-a);
                unique.forEach(h => {
                    if(!h) return;
                    qList.appendChild(createSettingBtn(getResIcon(h), `${h}p`, () => {
                        player.configure({ abr: { enabled: false } });
                        const target = tracks.find(t => t.height === h);
                        player.selectVariantTrack(target, true);
                        toggleSettings(false);
                    }));
                });

                // Audio
                const audios = player.getAudioLanguagesAndRoles();
                els.audioList.innerHTML = '';
                if(audios.length > 0) {
                    els.audioWrapper.style.display = 'block';
                    audios.forEach(a => {
                        const label = (a.language + (a.role ? ` (${a.role})` : '')).toUpperCase();
                        els.audioList.appendChild(createSettingBtn('audiotrack', label, () => {
                            player.selectAudioLanguage(a.language, a.role);
                            toggleSettings(false);
                        }));
                    });
                } else {
                    els.audioWrapper.style.display = 'none';
                }

                // Captions
                const subs = player.getTextTracks().filter(t => t.kind === 'subtitle' || t.kind === 'caption');
                els.captionList.innerHTML = '';
                if(subs.length > 0) {
                    els.captionWrapper.style.display = 'block';
                    els.captionList.appendChild(createSettingBtn('subtitles_off', 'Off', () => {
                        player.setTextTrackVisibility(false);
                        toggleSettings(false);
                    }));
                    subs.forEach(t => {
                        const label = t.label || t.language || 'Unknown';
                        els.captionList.appendChild(createSettingBtn('subtitles', label, () => {
                            player.selectTextTrack(t);
                            player.setTextTrackVisibility(true);
                            toggleSettings(false);
                        }));
                    });
                } else {
                    els.captionWrapper.style.display = 'none';
                }

                // Speed
                els.speedList.innerHTML = '';
                [0.5, 1, 1.25, 1.5, 2].forEach(rate => {
                    els.speedList.appendChild(createSettingBtn('speed', `${rate}x`, () => {
                        els.video.playbackRate = rate;
                        toggleSettings(false);
                    }));
                });

                focusList = Array.from(els.settings.querySelectorAll('.focusable'));
                focusIndex = 0;
                updateFocus();
            }

            // --- Player ---
            async function playChannel(idx) {
                if(idx < 0 || idx >= allChannels.length) return;
                currentChannelIndex = idx;
                const ch = allChannels[idx];
                
                els.name.textContent = ch.name;
                els.group.textContent = ch.group || 'Live TV';
                els.logo.src = ch.logo || '/assets/favicon.svg';
                
                // Show info briefly
                els.info.classList.add('visible');
                clearTimeout(infoTimeout);
                infoTimeout = setTimeout(() => els.info.classList.remove('visible'), 5000);

                els.video.pause();
                els.video.removeAttribute('src');

                try {
                    const res = await fetch(`${API_GET_DATA}?channel=${encodeURIComponent(ch.name)}`);
                    if(!res.ok) throw new Error("Offline");
                    const data = await res.json();
                    
                    const config = { drm: { servers: {}, clearKeys: {} } };
                    if(data.ClearKey?.k1 && data.ClearKey?.k2) {
                        config.drm.clearKeys[data.ClearKey.k1] = data.ClearKey.k2;
                    }
                    player.configure(config);
                    await player.load(data.manifestUri);
                    els.video.play().catch(e=>{});
                } catch(e) {
                    els.name.textContent = "Stream Offline";
                }
            }

            // --- Navigation ---
            function toggleGuide(show) {
                if(show) {
                    els.guide.classList.add('active');
                    currentScope = 'guide';
                    focusList = Array.from(els.guide.querySelectorAll('.focusable'));
                    // Focus current channel if possible
                    const curr = Array.from(els.channelList.children).find(el => el.dataset.index == currentChannelIndex);
                    focusIndex = curr ? focusList.indexOf(curr) : 0;
                    updateFocus();
                } else {
                    els.guide.classList.remove('active');
                    currentScope = 'player';
                }
            }

            function toggleSettings(show) {
                if(show) {
                    els.settings.classList.add('active');
                    currentScope = 'settings';
                    renderSettings();
                } else {
                    els.settings.classList.remove('active');
                    currentScope = 'player';
                }
            }

            function updateFocus() {
                document.querySelectorAll('.focused').forEach(el => el.classList.remove('focused'));
                if(focusList[focusIndex]) {
                    const el = focusList[focusIndex];
                    el.classList.add('focused');
                    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }

            function handleInput(key) {
                // Player Scope
                if(currentScope === 'player') {
                    switch(key) {
                        case 'ArrowUp': 
                            playChannel((currentChannelIndex - 1 + allChannels.length) % allChannels.length);
                            break;
                        case 'ArrowDown':
                            playChannel((currentChannelIndex + 1) % allChannels.length);
                            break;
                        case 'ArrowLeft': toggleGuide(true); break;
                        case 'ArrowRight': toggleSettings(true); break;
                        case 'Enter':
                            els.info.classList.add('visible');
                            clearTimeout(infoTimeout);
                            infoTimeout = setTimeout(() => els.info.classList.remove('visible'), 4000);
                            break;
                    }
                }
                // Menus Scope
                else if(currentScope === 'guide' || currentScope === 'settings') {
                    switch(key) {
                        case 'ArrowUp':
                            focusIndex = Math.max(0, focusIndex - 1);
                            updateFocus();
                            break;
                        case 'ArrowDown':
                            focusIndex = Math.min(focusList.length - 1, focusIndex + 1);
                            updateFocus();
                            break;
                        case 'ArrowLeft':
                            if(currentScope === 'settings') toggleSettings(false);
                            break;
                        case 'ArrowRight':
                            if(currentScope === 'guide') toggleGuide(false);
                            break;
                        case 'Enter':
                            if(focusList[focusIndex]) focusList[focusIndex].click();
                            break;
                        case 'Back':
                        case 'Escape':
                            if(currentScope === 'guide') toggleGuide(false);
                            if(currentScope === 'settings') toggleSettings(false);
                            break;
                    }
                }
            }

            // --- Event Listeners ---
            document.addEventListener('keydown', e => {
                let key = e.key;
                if(key === 'Escape') key = 'Back';
                if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter','Back'].includes(key)) {
                    e.preventDefault();
                    handleInput(key);
                }
            });

            ['up','down','left','right','ok'].forEach(k => {
                const btn = document.getElementById('remote-'+k);
                if(btn) btn.onclick = (e) => {
                    e.preventDefault();
                    let key = 'Enter';
                    if(k !== 'ok') key = 'Arrow' + k.charAt(0).toUpperCase() + k.slice(1);
                    handleInput(key);
                };
            });

            init();
        });
    </script>
</body>
</html>
